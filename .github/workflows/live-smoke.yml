name: Live smoke test (Claude API)

# Manual only: each run makes real, billed Claude API calls.
# Requires repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      question:
        description: Question for FinBot
        default: "How much did total revenue grow from Q1 to Q2 FY2026, in percent?"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QUESTION: ${{ inputs.question }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1
          fi

      - name: Package
        run: mvn -B -q package -DskipTests

      - name: Start harness
        run: |
          java -jar target/agent-harness-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Invoke agent
        run: |
          jq -n --arg m "$QUESTION" '{message: $m}' > body.json
          curl -sf -X POST http://localhost:8080/api/v1/agent/invoke \
            -H 'Content-Type: application/json' -H 'X-User-Id: ci-smoke' \
            --data @body.json | tee result.json | jq .
          test "$(jq -r .outcome result.json)" = "COMPLETED"
          jq -e '.toolCalls | map(.name) | index("search_filings")' result.json > /dev/null

      - name: Show token metrics
        if: always()
        run: curl -s http://localhost:8080/actuator/prometheus | grep '^gen_ai_' || true

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
